name: Confluence mirror

# Keeps the Imago Confluence space in step with this repository.
# Content already flows live (Git for Confluence renders each file from main on view);
# this job only adds pages for files and folders that do not have one yet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be created without creating anything
        type: boolean
        default: true
      prune_excluded:
        description: Move pages under config.excludePrefixes (run directories) to the Confluence trash. Opt-in; combine with dry_run first.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: confluence-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create missing Confluence pages
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.prune_excluded }}" = "true" ] && ARGS="$ARGS --prune-excluded"
          fi
          node .github/confluence-mirror/mirror.mjs $ARGS
